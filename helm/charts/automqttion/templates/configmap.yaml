{{- if .Values.config }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "automqttion.fullname" . }}
  labels:
    {{- include "automqttion.labels" . | nindent 4 }}
data:
  config.yml: |-
    {{- if kindIs "string" .Values.config }}
    {{- .Values.config | nindent 4 }}
    {{- else }}
    {{- toYaml .Values.config | nindent 4 }}
    {{- end }}
{{- end }}
