# Default values for automqttion.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Singleton deployment: standard MQTT v3.1.1 subscriptions duplicate every
# action across replicas until MQTT v5 $share/ shared subscriptions are used.
replicaCount: 1

strategy:
  type: Recreate

image:
  repository: ghcr.io/mychaos87/automqttion
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  capabilities:
    drop:
      - ALL

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

env: []

# Optional YAML string or mapping mounted at /config/config.yml (overrides baked default config).
config: ""

nodeSelector: {}

tolerations: []

affinity: {}
